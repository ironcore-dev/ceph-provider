name: Run integration tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  integration-tests:
    name: integration-tests (client ${{ matrix.client }}, cluster ${{ matrix.cluster }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Ceph client libraries the provider is built with
        client: [v19.2.7, v20.2.4]
        # Ceph cluster the provider connects to
        cluster: [v19.2.7, v20.2.4]
    if: contains(github.event.pull_request.labels.*.name, 'integration-tests')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run go tests
        run: |
          make docker-integration-tests CEPH_CLIENT_VERSION=${{ matrix.client }} CEPH_TEST_CLUSTER_VERSION=${{ matrix.cluster }}
